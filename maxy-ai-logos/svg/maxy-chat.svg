      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="amberChat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow_chat" x="-20%" y="-20%" width="140%" height="140%">
