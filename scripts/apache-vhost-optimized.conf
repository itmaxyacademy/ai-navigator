<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# ─── GZIP COMPRESSION ───────────────────────────────────────────────────────
	<IfModule mod_deflate.c>
		AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
		AddOutputFilterByType DEFLATE application/javascript application/json
		AddOutputFilterByType DEFLATE application/x-javascript text/javascript
		AddOutputFilterByType DEFLATE font/woff font/woff2 image/svg+xml
		# Don't compress already-compressed files
		SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|avif|zip|gz|br)$ no-gzip
		# Set compression level (1-9)
		DeflateCompressionLevel 6
	</IfModule>

	# ─── LONG-TERM CACHING FOR HASHED ASSETS ────────────────────────────────────
	<IfModule mod_headers.c>
		# Vite hashes asset filenames: index-Abc123.js / index-Abc123.css
		# These never change content → cache 1 year
		<FilesMatch "\.(js|css|woff|woff2|ttf|svg|webp|avif|png|jpg|jpeg|ico)$">
			Header set Cache-Control "public, max-age=31536000, immutable"
		</FilesMatch>
		# index.html should never be cached (always fresh)
		<FilesMatch "index\.html$">
			Header set Cache-Control "no-cache, no-store, must-revalidate"
			Header set Pragma "no-cache"
			Header set Expires "0"
		</FilesMatch>
		# Security headers
		Header always set X-Content-Type-Options "nosniff"
		Header always set X-Frame-Options "SAMEORIGIN"
	</IfModule>

	# ─── BROWSER-SIDE EXPIRES ────────────────────────────────────────────────────
	<IfModule mod_expires.c>
		ExpiresActive On
		ExpiresByType text/html "access plus 0 seconds"
		ExpiresByType text/css "access plus 1 year"
		ExpiresByType application/javascript "access plus 1 year"
		ExpiresByType application/json "access plus 1 hour"
		ExpiresByType image/png "access plus 1 year"
		ExpiresByType image/jpeg "access plus 1 year"
		ExpiresByType image/webp "access plus 1 year"
		ExpiresByType font/woff "access plus 1 year"
		ExpiresByType font/woff2 "access plus 1 year"
	</IfModule>

</VirtualHost>
